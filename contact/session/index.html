<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session</title>
    <link rel="icon" href="https://play-lh.googleusercontent.com/EyZzBivWAT_6dFOiIZ9JwuyE8duosWa98oDXe46yVUqMMTp07b0JVdmJEYxMrRWXzl1K=w240-h480-rw" type="image/png">
    <script src="/assets/theme.js"></script>
    <style>
        :root {
            --page-bg: linear-gradient(135deg, #eee6f3 0%, #ab82c5 100%);
            --card-bg: #ffffff;
            --card-shadow: rgba(51, 6, 98, 0.15);
            --caption: #6d6d6d;
        }

        [data-theme="dark"] {
            --page-bg: linear-gradient(135deg, #140228 0%, #330662 100%);
            --card-bg: #1f0439;
            --card-shadow: rgba(0, 0, 0, 0.4);
            --caption: #b8b8b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: var(--page-bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .image-wrapper {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px var(--card-shadow);
            max-width: 90vw;
            max-height: 90vh;
        }

        /* The QR code stays on white so it scans in both themes */
        .centered-image {
            max-width: 100%;
            max-height: 70vh;
            height: auto;
            display: block;
            border-radius: 8px;
            background: #ffffff;
        }

        .caption {
            text-align: center;
            margin-top: 15px;
            color: var(--caption);
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="image-wrapper">
        <img src="./session.png" 
             alt="Session QR code" 
             class="centered-image">
        <p class="caption">。</p>
    </div>
</body>
</html>
