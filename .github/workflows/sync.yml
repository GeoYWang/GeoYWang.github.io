name: Sync to pages repo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Mirror into GeoYWang/pages
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -e

          # Drop this repo's git metadata and workflow files so they
          # don't get copied into the target repo.
          rm -rf .git .github

          # Recreate the CNAME file. Without this line the force-push
          # below would delete it and geo.is-a.dev would stop working.
          echo "geo.is-a.dev" > CNAME

          git init -b main
          git config user.name "GeoYWang"
          git config user.email "208766262+GeoYWang@users.noreply.github.com"
          git add -A
          git commit -m "Sync from GeoYWang.github.io@${GITHUB_SHA::7}"
          git push --force \
            "https://x-access-token:${SYNC_TOKEN}@github.com/GeoYWang/pages.git" main
